version: "3.8"

services:
  web:
    build: .
    container_name: user_info
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --no-access-log
    volumes:
      - .:/app

  db:
    image: postgres:14
    container_name: user_info_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: